<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala Tokens — Token generator</title>
    <meta name="description" content="Escala Tokens — Token generator. Build a minimal, custom design token system and sync it live to Figma." />
    <meta property="og:title" content="Escala Tokens — Token generator" />
    <meta property="og:description" content="Escala Tokens — Token generator. Build a minimal, custom design token system and sync it live to Figma." />
    <meta property="og:type" content="website" />
    <script>
      // Apply persisted theme before paint to avoid a flash. Default: DARK —
      // only an explicit stored 'light' opts out, so a first visit and a
      // storage failure both land dark. Must stay the exact inverse of
      // `getTheme()` in src/lib/theme.ts or the pre-paint class and the app's
      // own read disagree for one frame.
      (function () {
        try {
          if (localStorage.getItem('sd-theme') !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
