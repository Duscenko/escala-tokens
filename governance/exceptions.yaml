- id: EXC-2026-11-16-001
  rule: COL-002
  scope: Border/control, Border/control-hover (Light and Dark)
  rationale: "Owner decisions DEC-2026-11-16-004 and DEC-2026-11-18-008: the Figma file is the rule. Light Black Alpha/03 (hover /04) reads 1.41:1; Escala Dark White Alpha/01 (hover /02) reads about 1.09:1 (hover 1.26:1), below the 3:1 of WCAG 1.4.11. Strong borders belong to the future high-contrast mode; review when that mode is planned."
  owner: Cesar Durango
  reviewBy: 2027-02-16

- id: EXC-2026-11-16-002
  rule: COL-002
  scope: Status/critical/content (Dark)
  rationale: "Owner decision DEC-2026-11-16-006: the Figma file is the rule. Dark critical text is Error Dark/10 (#fb493d), Lc ~42 on its own tint, under the 60 of large-text; WCAG 3:1 still holds (audit intent pinned-status-text)."
  owner: Cesar Durango
  reviewBy: 2027-02-16

- id: EXC-2026-11-17-001
  rule: COL-002
  scope: Content/on-secondary on Action/secondary/hover and /pressed (Light)
  rationale: "Owner decision DEC-2026-11-17-001: the secondary button walks its ramp two steps above the card (Light 05 · 06 · 07). On hover (Gray/06) the label keeps WCAG AA but reads Lc ~57; on pressed (Gray/07) it reads 4.2:1 in the default neutrals. Transient states, audited as pressed-label (WCAG 3:1, no APCA term); the resting state still clears AA and Lc 60."
  owner: Cesar Durango
  reviewBy: 2027-02-17

